<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shoreline · Operator</title><style>body{font:16px/1.5 system-ui;background:#f0f3f5;color:#172d3c;margin:0}main{max-width:1100px;margin:auto;padding:30px}article{background:white;border:1px solid #ccd6dc;border-radius:14px;padding:20px;margin:15px 0}label{display:block;margin:8px 0}input,select,textarea,button{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}textarea,input{width:100%}button{background:#183b50;color:white;border:0;border-radius:7px;cursor:pointer}small{color:#526575}h1{font-size:42px;letter-spacing:-2px}p{overflow-wrap:anywhere;white-space:pre-wrap}</style><main><small>SHORELINE DIGITAL / PRIVATE OPERATIONS</small><h1>Sales inbox.</h1><p>Actual stored requests only. A status change is not proof of payment. Verify bank or processor records independently.</p><p><a href="/commerce">Open revenue workspace →</a></p><button id="refresh">Refresh inbox</button><p id="status" role="status"></p><section id="rows"></section></main><script>
const stages=['new','contacted','qualified','proposal','accepted','deposit_verified','delivery','completed','lost'];const el=(tag,text)=>{let x=document.createElement(tag);x.textContent=text;return x};async function load(){let r=await fetch('/api/operator/leads');if(!r.ok){document.querySelector('#status').textContent='Inbox unavailable';return}let {leads}=await r.json();let root=document.querySelector('#rows');root.replaceChildren();document.querySelector('#status').textContent=leads.length+' stored requests';for(let l of leads){let a=el('article','');a.append(el('small',l.id+' · '+l.created+' · '+l.campaign+' / '+l.source),el('h2',l.name+' — '+l.service),el('p',l.contact+' · '+l.language+'\n'+l.details));let fields={};for(let k of ['status','owner','next_action','next_date','evidence']){let label=el('label',k.replaceAll('_',' '));let input=el(k==='status'?'select':k==='evidence'?'textarea':'input','');if(k==='status')for(let s of stages){let o=el('option',s);o.value=s;input.append(o)}if(k==='next_date')input.type='date';input.value=l[k];fields[k]=input;label.append(input);a.append(label)}let b=el('button','Save changes'),msg=el('p','');b.onclick=async()=>{let payload={id:l.id};for(let k in fields)payload[k]=fields[k].value;let r=await fetch('/api/operator/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});msg.textContent=r.ok?'Saved':'Update failed; deposit status requires evidence.'};a.append(b,msg);root.append(a)}}document.querySelector('#refresh').onclick=load;load();</script><p><a href="/growth">Growth workspace ↗</a></p></html>
