name: Browser experience QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - run: python browser_qa_v10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shoreline-browser-receipts
          path: browser-receipts/
          if-no-files-found: warn
