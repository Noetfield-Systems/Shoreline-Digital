name: Shoreline regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_excellence_v10.py
      - run: python -m unittest -v test_runtime test_commerce test_growth test_revenue_v5 test_launch_v6 test_intelligence_v7
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          for path in pathlib.Path('public').glob('*.html'):
              for script in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', path.read_text(), re.S|re.I):
                  if script.strip():
                      with tempfile.NamedTemporaryFile(suffix='.js', mode='w') as f:
                          f.write(script)
                          f.flush()
                          subprocess.run(['node','--check',f.name],check=True)
          PY

      - name: Validate agency assets
        run: |
          node --check vercel-studio/app.js
          node --check public/v8-preview.js
          node --check public/studio.js
          node --check public/excellence.js
          cmp vercel-studio/style.css public/agency.css
          python -m json.tool vercel-studio/vercel.json > /dev/null
      - name: Verify agency navigation and intake
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
                  self.links=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a:
                      assert a['id'] not in self.ids, a['id']
                      self.ids.add(a['id'])
                  if tag in ('a','link','script'):
                      self.links.append(a.get('href',a.get('src','')))
          for name in ('studio-en.html','studio-fa.html'):
              p=Page()
              p.feed((Path('public')/name).read_text())
              assert {'intake-form','request-status','submit','theme','menu','mobilelinks'} <= p.ids
              for h in p.links:
                  if h.startswith('#'): assert h[1:] in p.ids, (name,h)
                  elif h.startswith('/') and h!='/': assert (Path('public')/h[1:]).is_file(), (name,h)
          for name in ('index.html','fa.html'):
              s=(Path('vercel-studio')/name).read_text()
              assert 'id="intake-form"' not in s
              assert 'noindex,nofollow' in s
          PY

      - name: Validate V10 rendered service routes
        run: python -m unittest -v test_excellence_v10
