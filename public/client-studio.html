<!doctype html><html lang="en" dir="ltr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Studio · Shoreline Digital</title><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/v7.css"></head><body><main class="studio7"><nav><a href="/">shoreline. DIGITAL</a><button class="control" id="theme7">Light / Dark</button></nav><header class="intro7"><div class="kicker">Private client studio</div><h1 id="title">Your project, in view.</h1><p id="state">Use the private access link sent by Shoreline. No personal data is stored in your browser.</p><div class="actions"><button class="btn secondary" id="language">فارسی</button><button class="btn secondary" id="refresh">Refresh</button></div><p id="status" class="status7" role="status"></p></header><div class="grid7" id="workspace" hidden><section class="panel7"><h2 data-fa="مراحل پروژه">Milestones</h2><div id="milestones"></div></section><section class="panel7"><h2 data-fa="صورتحساب‌ها">Invoices</h2><div id="invoices"></div></section><section class="panel7 wide7"><h2 data-fa="یافته‌های مستند">Evidence & recommendations</h2><div id="findings"></div></section><section class="panel7 wide7"><h2 data-fa="بازخورد شما">Your feedback</h2><form id="feedback"><label><span data-fa="پیام">Message</span><textarea name="message" required maxlength="2000"></textarea></label><button class="btn" data-fa="ارسال بازخورد">Send feedback</button><p id="feedback-status" role="status"></p></form></section></div></main><script>const doc=document.documentElement;try{doc.dataset.theme=localStorage.getItem('shoreline-theme')==='light'?'light':'dark'}catch{}document.querySelector('#theme7').onclick=()=>{doc.dataset.theme=doc.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('shoreline-theme',doc.dataset.theme)}catch{}};const $=s=>document.querySelector(s);function node(tag,txt){const e=document.createElement(tag);e.textContent=String(txt??'');return e}function item(root,title,lines){const d=document.createElement('div');d.className='result7';d.append(node('strong',title));for(const line of lines)d.append(node('p',line));root.append(d);return d}function clear(id){const e=$(id);e.replaceChildren();return e}function link(root,label,url){try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))return;const a=node('a',label);a.href=u.href;a.rel='noopener noreferrer';a.target='_blank';root.append(a)}catch{}}async function api(path,data){const r=await fetch(path,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j;try{j=await r.json()}catch{throw Error('Request not confirmed. Sign in or retry.')}if(!r.ok)throw Error(j.error||'Request failed');return j}const token=location.hash.slice(1);let fa=false;const tr=(a,b)=>fa?b:a;$('#language').onclick=()=>{fa=!fa;doc.lang=fa?'fa':'en';doc.dir=fa?'rtl':'ltr';document.querySelectorAll('[data-fa]').forEach(x=>{if(!x.dataset.en)x.dataset.en=x.textContent;x.textContent=fa?x.dataset.fa:x.dataset.en});$('#language').textContent=fa?'English':'فارسی';refresh()};async function refresh(){try{if(!/^[A-Za-z0-9_-]{43}$/.test(token))throw Error(tr('A valid private link is required.','لینک خصوصی معتبر لازم است.'));const d=await api('/api/v7/client',{token});$('#title').textContent=d.project.title;$('#state').textContent=tr('Project status: ','وضعیت پروژه: ')+d.project.status;$('#workspace').hidden=false;$('#status').textContent='';let r=clear('#milestones');for(const m of d.milestones)item(r,m.title,[m.due_date+' · '+m.status,m.evidence]);if(!r.children.length)r.textContent=tr('No milestones yet.','هنوز مرحله‌ای ثبت نشده است.');r=clear('#invoices');for(const i of d.invoices)item(r,i.kind,[new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(i.amount/100),i.payment_status]);r=clear('#findings');for(const f of d.findings){const e=item(r,f.observation,[f.interpretation,f.recommendation,f.observed_on+' · '+f.confidence]);link(e,tr('Source','منبع'),f.source_url)}if(!r.children.length)r.textContent=tr('No shared findings yet.','هنوز یافته‌ای منتشر نشده است.')}catch(e){$('#workspace').hidden=true;$('#status').textContent=e.message}}$('#refresh').onclick=refresh;$('#feedback').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{await api('/api/v7/feedback',{token,message:f.elements.message.value});$('#feedback-status').textContent=tr('Feedback received.','بازخورد دریافت شد.');f.reset()}catch(e){$('#feedback-status').textContent=e.message}finally{b.disabled=false}};refresh();</script></body></html>
