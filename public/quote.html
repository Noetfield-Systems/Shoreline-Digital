<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Shoreline Digital — Your proposal</title><style>body{margin:0;background:#edf1f4;color:#193044;font:16px/1.65 system-ui}main{max-width:780px;margin:auto;padding:38px 20px}article{background:white;padding:clamp(20px,4vw,40px);border:1px solid #d0dbe3;border-radius:20px}h1{font-size:clamp(36px,6vw,60px);letter-spacing:-.045em;line-height:1.1}h2{font-size:22px}p{white-space:pre-wrap;overflow-wrap:anywhere}button,input{font:inherit;padding:12px;border-radius:8px;border:1px solid #a9bac6}button{background:#17384e;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:15px 0}small{color:#607588}section{border-top:1px solid #dae2e7;padding:15px 0}input:not([type=checkbox]){width:100%;box-sizing:border-box}</style><main><small>SHORELINE DIGITAL / PRIVATE PROPOSAL</small><article id="view"><p id="status" role="status">Loading…</p></article></main><p style="max-width:780px;margin:0 auto;padding:0 20px 24px">CAD · Applicable tax is confirmed before payment. مبلغ به دلار کانادا؛ مالیات قابل اعمال پیش از پرداخت مشخص می‌شود. · Merchant: Noetfield Systems Inc.</p><script>
const token=location.hash.slice(1),root=document.querySelector('#view');const e=(tag,s)=>{const n=document.createElement(tag);n.textContent=s;return n};const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n/100);async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error);return j}async function load(){try{let r=await fetch('/api/quote?token='+encodeURIComponent(token));if(!r.ok)throw Error('Proposal unavailable');let q=await r.json(),fa=q.language==='fa',t=(a,b)=>fa?b:a;document.documentElement.lang=q.language;document.documentElement.dir=fa?'rtl':'ltr';root.replaceChildren(e('small',q.id),e('h1',t('Your project proposal','پیشنهاد پروژه شما')),e('p',t('Valid until ','اعتبار تا ')+q.expires));for(let [label,value] of [[t('Scope','محدوده کار'),q.scope],[t('Deliverables','اقلام تحویلی'),q.deliverables],[t('Terms','شرایط'),q.terms],[t('Total (CAD)','مبلغ کل (دلار کانادا)'),money(q.total)],[t('Deposit','پیش‌پرداخت'),money(q.deposit)]]){let s=e('section','');s.append(e('h2',label),e('p',value));root.append(s)}let status=e('p','');status.setAttribute('role','status');if(!q.accepted&&!q.expired){let name=e('input','');name.placeholder=t('Full name','نام کامل');name.autocomplete='name';let agree=e('input','');agree.type='checkbox';let label=e('label',t(' I accept this scope, price and terms.',' محدوده، مبلغ و شرایط را می‌پذیرم.'));label.prepend(agree);let b=e('button',t('Accept proposal','پذیرش پیشنهاد'));b.onclick=async()=>{b.disabled=true;try{await post('/api/quote/accept',{token,name:name.value,agree:agree.checked,digest:q.digest});await load()}catch(err){status.textContent=err.message;b.disabled=false}};root.append(name,label,b)}else root.append(e('h2',q.accepted?t('Accepted','پذیرفته شده'):t('Expired','منقضی شده')));for(let i of q.invoices){let s=e('section','');s.append(e('h2',(i.kind==='deposit'?t('Deposit','پیش‌پرداخت'):t('Balance','مانده'))+' · '+money(i.amount)),e('p',i.id+' · '+(i.paid?t('Payment recorded','پرداخت ثبت شده'):t('Awaiting payment','در انتظار پرداخت'))));if(!i.paid&&!q.checkout_configured)s.append(e('p',t('Online payment is not connected. Contact your representative for payment arrangements.','پرداخت آنلاین متصل نیست. برای هماهنگی پرداخت با نماینده خود تماس بگیرید.')));if(!i.paid&&q.checkout_configured){let b=e('button',t('Pay securely with Stripe','پرداخت امن با Stripe'));b.onclick=async()=>{b.disabled=true;try{let j=await post('/api/quote/checkout',{token,invoice_id:i.id});location.href=j.url}catch(err){status.textContent=t('Online checkout unavailable. Contact your Shoreline representative.','پرداخت آنلاین در دسترس نیست. با نماینده Shoreline تماس بگیرید.');b.disabled=false}};s.append(b)}root.append(s)}root.append(status)}catch(err){root.replaceChildren(e('p',err.message))}}load();</script></html>
